
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YallaGo | Al-Fikr Al-Modi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f7;color:#17243b}
.hidden{display:none!important}
.login-card{width:min(420px,92%);margin:10vh auto;background:white;padding:38px;border-radius:16px;box-shadow:0 12px 40px #14274620;text-align:center}
.logo{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:18px;background:#142746;color:#e2bd69;font-size:30px;font-weight:bold}
input,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #dce1e9;border-radius:7px;font-size:14px}
label{display:block;font-size:13px;font-weight:bold}
button{padding:11px 16px;border:0;border-radius:7px;background:#142746;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#29466e}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:14px;font-size:13px}
header{background:#142746;color:white;padding:17px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header strong{font-size:20px;color:#e2bd69}
header span{font-size:13px}
.layout{display:flex;min-height:calc(100vh - 65px)}
nav{width:220px;background:#fff;padding:18px 12px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent;color:#263752}
nav button.active,nav button:hover{background:#142746;color:white}
main{padding:26px;width:100%;min-width:0}
h2{margin-top:0}
.muted{color:#778196;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:15px;margin:20px 0}
.card,.panel{background:white;border-radius:12px;padding:20px;box-shadow:0 3px 14px #1427460d}
.card strong{display:block;font-size:28px;color:#142746;margin-top:10px}
.panel{margin-top:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e9edf2}
th{background:#f5f7fa}
form.add-form{max-width:520px;margin-top:15px}
form.add-form button{margin-top:5px}
.notice{padding:12px;border-radius:7px;margin:12px 0;font-size:13px;background:#f1f3f7}
.good{color:#16803c}.bad{color:#b42318}
@media(max-width:700px){.layout{display:block}nav{width:100%;display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto;margin:0}main{padding:16px}}
</style>
</head>
<body>

<div id="loginScreen" class="login-card">
    <div class="logo">Y</div>
    <h1>YallaGo</h1>
    <p class="muted">Al-Fikr Al-Modi School<br>Administrator Dashboard</p>
    <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit" style="width:100%;margin-top:12px">Sign In</button>
        <div id="message"></div>
    </form>
    <p class="muted">Al-Fikr Al-Modi School · YallaGo</p>
</div>

<div id="adminScreen" class="hidden">
<header>
    <div><strong>YallaGo</strong><br><span>Al-Fikr Al-Modi School Management</span></div>
    <div><span id="welcome"></span> &nbsp; <button id="logoutButton">Logout</button></div>
</header>
<div class="layout">
<nav id="navigation">
    <button class="active" data-page="overview">Overview</button>
    <button data-page="classes">Classes</button>
<button data-page="recycle">🗑 Recycle Bin</button>
    <button data-page="students">Students</button>
    <button data-page="employees">Employees</button>
    <button data-page="devices">Devices</button>
    <button data-page="audit">Audit Log</button>
</nav>
<main>
    <div id="pageContent"></div>
</main>
</div>
</div>

<script>
const loginScreen=document.getElementById("loginScreen");
const adminScreen=document.getElementById("adminScreen");
const message=document.getElementById("message");
const pageContent=document.getElementById("pageContent");
let token=sessionStorage.getItem("yallago_token");
let currentUser=null;
let records={classes:[],students:[],employees:[],devices:[],audit:[]};

async function api(url,options={}){
    const response=await fetch(url,{
        ...options,
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token,
            ...(options.headers||{})
        }
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"Request failed.");
    return data;
}

function showError(error){
    alert(error.message||"Something went wrong.");
}

function safe(value){
    return String(value??"").replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
}

document.getElementById("loginForm").addEventListener("submit",async event=>{
    event.preventDefault();
    const button=document.getElementById("loginButton");
    button.disabled=true;
    button.textContent="Signing in...";
    message.textContent="";
    try{
        const response=await fetch("/api/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                username:document.getElementById("username").value.trim(),
                password:document.getElementById("password").value
            })
        });
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||"Login failed.");
        if(data.user.role!=="admin") throw new Error("Administrator access only.");
        token=data.token;
        currentUser=data.user;
        sessionStorage.setItem("yallago_token",token);
        sessionStorage.setItem("yallago_user",JSON.stringify(currentUser));
        await openDashboard();
    }catch(error){
        message.textContent=error.message;
        message.className="bad";
    }finally{
        button.disabled=false;
        button.textContent="Sign In";
    }
});

async function openDashboard(){
    currentUser=await api("/api/me");
    if(currentUser.role!=="admin") throw new Error("Administrator access only.");
    loginScreen.classList.add("hidden");
    adminScreen.classList.remove("hidden");
    document.getElementById("welcome").textContent="Welcome, "+currentUser.display_name;
    await loadAll();
    showPage("overview");
}

async function loadAll(){
    const endpoints=["classes","students","employees","devices","audit"];
    for(const name of endpoints){
        try{records[name]=await api("/api/admin/"+name);}
        catch(error){records[name]=[];console.error(name,error);}
    }
}

document.getElementById("navigation").addEventListener("click",event=>{
    const button=event.target.closest("button[data-page]");
    if(!button)return;
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    showPage(button.dataset.page);
});

function showPage(page){
    if(page==="overview"){
        pageContent.innerHTML=`
        <h2>Administrator Overview</h2>
        <p class="muted">Al-Fikr Al-Modi School · YallaGo Management System</p>
        <div class="cards">
            <div class="card">Classes<strong>${records.classes.length}</strong></div>
            <div class="card">Students<strong>${records.students.length}</strong></div>
            <div class="card">Employees<strong>${records.employees.length}</strong></div>
            <div class="card">Registered Devices<strong>${records.devices.length}</strong></div>
        </div>
        <div class="panel"><h3>Welcome to YallaGo</h3>
        <p>Use the navigation menu to manage school records and authorised devices.</p>
        <p class="muted">Your administrator account controls these school records.</p></div>`;
        }else if(page==="recycle"){
        pageContent.innerHTML=`
        <h2>Recycle Bin</h2>
        <p class="muted">Archived students, employees and devices.</p>
        <div class="panel" id="tablePanel">${recycleTable()}</div>`;
    }else if(page==="recycle"){
        pageContent.innerHTML=`
        <h2>Recycle Bin</h2>
        <p class="muted">Archived students, employees and devices.</p>
        <div class="panel" id="tablePanel">${recycleTable()}</div>`;
    }else{
        const titles={classes:"Classes",students:"Students",employees:"Employees",devices:"Devices",audit:"Administrative Audit Log"};        
        pageContent.innerHTML=`<h2>${titles[page]}</h2>
        ${page==="audit"?"":addForm(page)}
        <div class="panel" id="tablePanel">${tableFor(page)}</div>`;
    }
}

function addForm(page){
    if(page==="classes")return `
    <div class="panel"><h3>Add a Class</h3>
    <form class="add-form" id="addForm">
    <label>Class Name</label><input name="name" required>
    <button>Add Class</button></form></div>`;

    if(page==="students")return `
    <div class="panel"><h3>Register a Student</h3>
    <form class="add-form" id="addForm">
    <label>Student Number</label><input name="student_number" required>
    <label>Full Name</label><input name="full_name" required>
    <label>Class</label><select name="class_id" required>
    <option value="">Select a class</option>
    ${records.classes.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${safe(c.name)}</option>`).join("")}
    </select><button>Register Student</button></form></div>`;

    if(page==="employees")return `
    <div class="panel"><h3>Add an Employee</h3>
    <form class="add-form" id="addForm">
    <label>Username</label><input name="username" required>
    <label>Full Name</label><input name="display_name" required>
    <label>Password (at least 10 characters)</label><input name="password" type="password" minlength="10" required>
    <label>Role</label><select name="role" required>
    <option value="supervisor">Supervisor</option>
    <option value="reception">Reception</option>
    <option value="admin">Administrator</option>
    </select><button>Add Employee</button></form></div>`;

    if(page==="devices")return `
    <div class="panel"><h3>Register a Supervisor Device</h3>
    <form class="add-form" id="addForm">
    <label>Device Code</label><input name="device_code" required>
    <label>Supervisor</label><select name="employee_id" required>
    <option value="">Select supervisor</option>
    ${records.employees.filter(e=>e.role==="supervisor"&&e.is_active).map(e=>`<option value="${e.id}">${safe(e.display_name)}</option>`).join("")}
    </select>
    <label>Assigned Class</label><select name="class_id" required>
    <option value="">Select class</option>
    ${records.classes.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${safe(c.name)}</option>`).join("")}
    </select><button>Register Device</button></form></div>`;
    return "";
}
function recycleTable(){
    const archived = [
        ...records.students.filter(r=>!r.is_active).map(r=>({
            type:"Student",
            id:r.id,
            page:"students",
            name:r.full_name,
            details:"Student No: "+r.student_number+" | Class: "+(r.class_name||"—")
        })),
        ...records.employees.filter(r=>!r.is_active).map(r=>({
            type:"Employee",
            id:r.id,
            page:"employees",
            name:r.display_name,
            details:"Username: "+r.username+" | Role: "+r.role
        })),
        ...records.devices.filter(r=>!r.is_active).map(r=>({
            type:"Device",
            id:r.id,
            page:"devices",
            name:r.device_code,
            details:"Supervisor: "+(r.supervisor_name||"—")+" | Class: "+(r.device_label||"—")
        }))
    ];

    if(!archived.length){
        return "<p class='muted'>The Recycle Bin is empty.</p>";
    }

    return `<table>
        <thead><tr>
            <th>Type</th><th>Record</th><th>Details</th><th>Action</th>
        </tr></thead>
        <tbody>
        ${archived.map(r=>`<tr>
            <td>${safe(r.type)}</td>
            <td>${safe(r.name)}</td>
            <td>${safe(r.details)}</td>
            <td><button type="button" class="restore-button"
                data-page="${r.page}" data-id="${r.id}">Restore</button></td>
        </tr>`).join("")}
        </tbody></table>`;
}
function tableFor(page){
    let rows=records[page]||[];
    let columns={
        classes:["name","is_active"],
        students:["student_number","full_name","class_name"],
        employees:["username","display_name","role","is_active"],
        devices:["device_code","supervisor_name","device_label","is_active","last_seen_at"],
        audit:["actor_username","action","entity_type","entity_id","details","created_at"]
    }[page];
    if(!rows.length)return "<p class='muted'>No records found.</p>";
    return `<table><thead><tr>${columns.map(c=>`<th>${safe(c.replaceAll("_"," "))}</th>`).join("")}<th>Actions</th></tr></thead>
<tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td>${safe(row[c]??"—")}</td>`).join("")}<td>${["students","employees","devices"].includes(page)&&row.is_active?`<button type="button" class="archive-button" data-page="${page}" data-id="${row.id}">🗑 Archive</button>`:"—"}</td></tr>`).join("")}</tbody></table>`;}
pageContent.addEventListener("click", async event => {
    const button = event.target.closest(".restore-button");
    if (!button) return;

    const page = button.dataset.page;
    const id = button.dataset.id;

    if (!confirm("Restore this record?")) return;

    try {
        await api(`/api/admin/${page}/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ is_active: 1 })
        });

        alert("Record restored successfully.");
        await loadAll();
        showPage("recycle");
    } catch (error) {
        showError(error);
    }
});
pageContent.addEventListener("click", async event => {
    const button = event.target.closest(".archive-button");
    if (!button) return;

    const page = button.dataset.page;
    const id = button.dataset.id;

    if (!confirm("Are you sure you want to archive this record?")) return;

    try {
        await api(`/api/admin/${page}/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ is_active: 0 })
        });

        alert("Record archived successfully.");
        await loadAll();
        showPage(page);
    } catch (error) {
        showError(error);
    }
});
pageContent.addEventListener("submit",async event=>{
    if(event.target.id!=="addForm")return;
    event.preventDefault();
    const form=event.target;
    const page=document.querySelector("nav button.active").dataset.page;
    const body=Object.fromEntries(new FormData(form).entries());
    if(body.class_id)body.class_id=Number(body.class_id);
    if(body.employee_id)body.employee_id=Number(body.employee_id);
    const button=form.querySelector("button");
    button.disabled=true;
    try{
        await api("/api/admin/"+page,{method:"POST",body:JSON.stringify(body)});
        alert("Record added successfully.");
        await loadAll();
        showPage(page);
    }catch(error){showError(error);}
    finally{button.disabled=false;}
});

document.getElementById("logoutButton").addEventListener("click",()=>{
    sessionStorage.removeItem("yallago_token");
    sessionStorage.removeItem("yallago_user");
    token=null;
    currentUser=null;
    adminScreen.classList.add("hidden");
    loginScreen.classList.remove("hidden");
    document.getElementById("loginForm").reset();
    message.textContent="You have logged out.";
    message.className="good";
});

(async function restoreSession(){
    if(!token)return;
    try{await openDashboard();}
    catch(error){
        sessionStorage.removeItem("yallago_token");
        sessionStorage.removeItem("yallago_user");
        token=null;
        console.warn("Previous session expired or invalid.",error);
    }
})();
</script>
</body>
</html>
